<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Circular Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=4" />
    <link rel="icon" type="image/webp" href="/images/logo.webp?v=4" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawon Umi Catering — Artisanal Indonesian & Bespoke Dining</title>
    <meta name="description" content="Layanan katering artisanal terkurasi untuk resepsi pernikahan, jamuan VIP korporat, dan acara istimewa berakar pada kehangatan tradisi dan kemewahan bersahaja." />
    
    <!-- Preload LCP Hero Background Image with Responsive Media Query -->
    <link rel="preload" as="image" href="/images/hero_catering_buffet_mobile.webp" media="(max-width: 768px)" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero_catering_buffet.webp" media="(min-width: 769px)" type="image/webp" fetchpriority="high" />

    <!-- Google Fonts: Preconnect & Optimized Subsets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Lora:wght@500;600&family=Open+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Lora:wght@500;600&family=Open+Sans:wght@400;500;600&display=swap" />
    </noscript>
  </head>
  <body class="bg-[#FBF9F5] text-[#2C2521] antialiased selection:bg-[#C5A059] selection:text-[#2C2521]">
    <div id="root">
      <header class="sticky top-0 z-40 bg-[#FBF9F5]/90 border-b border-[#E8DFD1] h-20 flex items-center px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="/images/logo.webp" alt="Pawon Umi Logo" width="40" height="40" class="w-10 h-10 object-contain" />
            <span class="font-serif font-medium text-lg sm:text-2xl tracking-wider text-[#2C2521]">PAWON UMI</span>
          </div>
        </div>
      </header>
      <section id="beranda" class="relative flex flex-col justify-start lg:justify-center overflow-hidden border-b border-[#E8DFD1] pt-5 pb-8 sm:pt-7 sm:pb-10 lg:py-0 lg:h-[calc(100dvh-5.5rem)] lg:min-h-[550px] w-full">
        <div class="absolute inset-0 z-0">
          <picture>
            <source media="(max-width: 768px)" srcset="/images/hero_catering_buffet_mobile.webp" type="image/webp" />
            <img src="/images/hero_catering_buffet.webp" alt="Jamuan Prasmanan Pawon Umi Catering" fetchpriority="high" loading="eager" decoding="async" width="1200" height="670" class="w-full h-full object-cover object-center sm:object-[center_35%]" />
          </picture>
          <div class="absolute inset-0 bg-gradient-to-b md:bg-gradient-to-r from-[#FBF9F5] via-[#FBF9F5]/95 to-[#FBF9F5]/80 md:to-[#FBF9F5]/35"></div>
          <div class="absolute inset-0 bg-gradient-to-t from-[#FBF9F5] via-transparent to-[#FBF9F5]/50"></div>
        </div>
        <div class="relative z-10 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 my-0 lg:my-auto">
          <div class="max-w-3xl space-y-3.5 sm:space-y-4 lg:space-y-5">
            <div class="inline-flex items-center gap-2 px-3 py-0.5 sm:py-1 rounded-full bg-[#F5F3EF]/95 border border-[#D1C5B4] text-[#775A19] w-fit">
              <span class="w-1.5 h-1.5 rounded-full bg-[#C5A059] shrink-0"></span>
              <span class="text-[#4E4639] text-[11px] sm:text-xs">Kurasi Jamuan Kuliner Nusantara</span>
            </div>
            <h1 class="headline-lg font-medium text-[#2C2521]">
              Kemewahan Bersahaja dalam <span class="italic font-serif font-normal text-[#775A19]">Kehangatan Cita Rasa</span>
            </h1>
            <p class="body-md text-sm sm:text-base text-[#4E4639] max-w-2xl leading-relaxed">
              Dari resepsi pernikahan agung hingga jamuan VIP korporat terkurasi. Pawon Umi menyajikan harmoni rempah warisan Nusantara dengan standar higienis bersertifikasi Halal MUI dan estetika meja saji yang memikat.
            </p>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
